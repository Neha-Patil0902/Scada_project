<div class="flex justify-center items-center min-h-screen bg-gradient-to-br from-gray-100 to-gray-200">
    <form [formGroup]="policyForm" (ngSubmit)="savePolicy()" class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-md flex flex-col text-center">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Password Policy</h1>

        <div class="space-y-3 mb-3">
            <label class="flex items-center gap-2">
                <input type="checkbox" formControlName="requireUppercase" class="accent-blue-500">
                Require Uppercase
            </label>   
            
            <label class="flex items-center gap-2">
                <input type="checkbox" formControlName="requireLowercase" class="accent-blue-500">
                Require Lowercase
            </label>
            
            <label class="flex items-center gap-2">
                <input type="checkbox" formControlName="requireDigit" class="accent-blue-500">
                Require Digit
            </label>
            
            <label class="flex items-center gap-2">
                <input type="checkbox" formControlName="requireSpecialChar" class="accent-blue-500">
                Require Special Character
            </label>
        </div>
        <!-- Numeric Inputs -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700">Password Expiry (days)</label>
      <input type="number" formControlName="passwordExpiryDays" class="border rounded-lg p-2 w-full mt-1"/>
    </div>

    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700">Password History Count</label>
      <input type="number" formControlName="passwordHistoryCount" class="border rounded-lg p-2 w-full mt-1"/>
    </div>

    
    <!-- Submit & Cancel -->
     <div class="flex justify-end gap-3 mt-4">
        <button type="button" (click)="onClose()" class="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300">
          Cancel
        </button>
        <button type="submit"  class="px-4 py-2 rounded-lg bg-blue-500 text-white hover:bg-blue-600">
          Save Policy
        </button>
      </div>
    </form>

      <!-- only visible after clicking Save Policy -->
  <app-display-policy *ngIf="showPolicy"  [policy]="policyForm.value" class="mt-6"></app-display-policy>
</div>
